<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="imagesR/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  
  <title>Results summary</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body id="results-sumary">
  <div class="container-result">
    <div class="result">
      <p class="title"></p>
      <div class="circle">
        <p class="number">76</p>
        <p class="number-detail">of 100</p>
      </div>
      <p class="great">Great</p>
      <p class=" details">You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="sumary">
      <p class="title">Sumary</p>
      <div class="sumary-result reaction">
        <p class="text-sumary"> <img src="imagesR/icon-reaction.svg" alt="">Reaction</p>
        <p class="number">80&nbsp;<span class="percentage">/&nbsp;100</span></p>
      </div>
      <div class="sumary-result memory">
        <p class="text-sumary"> <img src="imagesR/icon-memory.svg" alt="">Memory</p>
        <p class="number"> 92&nbsp;<span class="percentage">/&nbsp;100</span></p>
      </div>
      <div class="sumary-result verbal">
        <p class="text-sumary"> <img src="imagesR/icon-verbal.svg" alt="">Verbal</p>
        <p class="number"> 61&nbsp;<span class="percentage">/&nbsp;100</span></p>
      </div>
      <div class="sumary-result visual">
        <p class="text-sumary"> <img src="imagesR/icon-visual.svg" alt="">Verbal</p>
        <p class="number"> 73&nbsp;<span class="percentage">/&nbsp;100</span></p>
      </div>
      <a href="#" class="btn-continue">Continue</a>
    </div>
  </div>
  <footer class="container-btn">
    <a href="indexperfil.html" class="btn-prev">Anteriores</a>
    <a href="index.html" class="btn-next">Inicio</a>
  </footer>
</body>
</html>
