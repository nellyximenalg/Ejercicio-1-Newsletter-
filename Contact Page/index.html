<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96" />
    <link rel="stylesheet" href="css/styles.css" />

    <title>Contact Page</title>
  </head>
  <body>
    <header class="top-bar">
      <img src="resources/Logo@2x.png" alt="Logo" class="logo" />
    </header>

    <main class="container">
      <h1 class="title">Interested in our business pricing?</h1>
      <p class="texto">
        Fill out the form to view details and we’ll contact you as soon as possible.
      </p>

      <form class="card">
        <div class="row">
          <div class="field">
            <label>Name</label>
            <input type="text" placeholder="Ethan Johnson" />
          </div>

          <div class="field">
            <label>Company Email</label>
            <input type="email" placeholder="ethan@johnson.com" />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>Company Size</label>
            <select>
              <option selected>50-100 employees</option>
              <option>1-10 employees</option>
              <option>10-50 employees</option>
              <option>100+ employees</option>
            </select>
          </div>

          <div class="field">
            <label>Subject</label>
            <select>
              <option selected>Building Landing pages</option>
              <option>Website Design</option>
              <option>Mobile App</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Message</label>
          <textarea placeholder="50-100 employees"></textarea>
        </div>

        <button type="submit">Contact Sales</button>
      </form>
    </main>
  </body>
</html>
