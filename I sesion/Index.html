<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Form</title>
    <link
      rel="shortcut icon"
      href="images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="css/Style.css" />
  </head>
  <body>
    <main>
      <section class="information">
        <h1 class="title">Learn to code by watching others</h1>
        <p class="text">
          See how experienced developers solve problems in real-time.
          <br />Watching scripted tutorials is great, but understanding how
          developers think is invaluable.
        </p>
      </section>
      <section class="form">
        <a href="#" class="btn"
          ><strong>Try it free 7 days</strong> then $20/mo. thereafter</a
        >
        <form action="" class="sign-up" id="form">
          <div class="form-container">
            <input
              type="text"
              name="firstname"
              id="firstname"
              placeholder="First Name"
            />
            <img src="images/icon-error.svg" alt="" class="error-image" />
            <small class="error"></small>
          </div>
          <div class="form-container">
            <input
              type="text"
              name="lastname"
              id="lastname"
              placeholder="Last Name"
            />
            <img src="images/icon-error.svg" alt="" class="error-image" />
            <small class="error"></small>
          </div>
          <div class="form-container">
            <input type="email" name="email" id="email" placeholder="Email" />
            <img src="images/icon-error.svg" alt="" class="error-image" />
            <small class="error"></small>
          </div>
          <div class="form-container">
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Password"
            />
            <img src="images/icon-error.svg" alt="" class="error-image" />
            <small class="error"></small>
          </div>
          <input
            type="submit"
            name="submit"
            id="submit"
            value="Claim your free trial"
          />
          <footer>
            <p>
              By clicking the button, you are agreeing to our
              <span class="terms">Terms and Services</span>
            </p>
          </footer>
        </form>
      </section>
    </main>
  </body>
  <script src="js/validacion.js"></script>
</html>
